# 独立开发模板报表（可选）
# 根目录 docker-compose.yml 已包含全部服务；此文件便于只启动本子项目。

services:
  template-report-backend:
    build: ./backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/app:/app/app
    environment:
      - PYTHONUNBUFFERED=1

  template-report-frontend:
    build: ./frontend
    ports:
      - "5174:5174"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_PROXY=http://template-report-backend:8001
    depends_on:
      - template-report-backend
